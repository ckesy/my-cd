<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>东风车队管理系统 · 业务逻辑全景思维导图</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #F5F7FA; color: #0F172A; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --ink: #0F172A; --sub: #64748B; --mute: #94A3B8;
    --line: #CBD5E1; --card: #FFFFFF; --hair: #E2E8F0;
    --brand: #c8102e; --soft: #F7F9FC;
  }

  /* ---------- header ---------- */
  .hd {
    position: fixed; inset: 0 0 auto 0; height: 62px; z-index: 30;
    display: flex; align-items: center; gap: 14px; padding: 0 18px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hair);
  }
  .hd-logo { width: 4px; height: 26px; border-radius: 2px; background: var(--brand); flex: 0 0 auto; }
  .hd-t { font-size: 15px; font-weight: 800; letter-spacing: .2px; white-space: nowrap; }
  .hd-s { font-size: 11.5px; color: var(--mute); white-space: nowrap; margin-left: -6px; }
  .grow { flex: 1; }

  .search {
    position: relative; width: 260px; flex: 0 0 auto;
  }
  .search input {
    width: 100%; height: 32px; border-radius: 8px; border: 1px solid var(--hair);
    background: var(--soft); padding: 0 30px 0 30px; font-size: 12.5px; color: var(--ink);
    outline: none; transition: .15s;
  }
  .search input:focus { background: #fff; border-color: #b9c4d4; box-shadow: 0 0 0 3px rgba(200,16,46,.06); }
  .search .ic { position: absolute; left: 9px; top: 8px; width: 15px; height: 15px; opacity: .45; }
  .search .cnt {
    position: absolute; right: 8px; top: 6px; font-size: 11px; color: var(--mute);
    background: #fff; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--hair);
  }

  .btns { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .btn {
    height: 32px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--hair);
    background: #fff; color: #475569; font-size: 12px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; transition: .14s;
  }
  .btn:hover { border-color: #b9c4d4; color: var(--ink); background: #FCFDFE; }
  .btn:active { transform: translateY(.5px); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: #a80d26; border-color: #a80d26; color: #fff; }
  .btn svg { width: 13px; height: 13px; }

  /* ---------- domain chips ---------- */
  .chips {
    position: fixed; left: 0; right: 0; top: 62px; height: 42px; z-index: 25;
    display: flex; align-items: center; gap: 6px; padding: 0 18px; overflow-x: auto;
    background: rgba(247,249,252,.94); border-bottom: 1px solid var(--hair);
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; height: 26px; padding: 0 10px 0 8px; border-radius: 7px;
    border: 1px solid var(--hair); background: #fff; font-size: 11.5px; font-weight: 600;
    color: #475569; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: .14s;
  }
  .chip:hover { border-color: #b9c4d4; color: var(--ink); }
  .chip.on { background: #fff; border-color: currentColor; }
  .chip i { width: 7px; height: 7px; border-radius: 2px; display: block; }
  .chip b { font-weight: 700; color: var(--mute); font-size: 10.5px; }

  /* ---------- stage ---------- */
  #stage {
    position: fixed; inset: 104px 0 26px 0; overflow: hidden; cursor: grab;
    background-image: radial-gradient(circle at 1px 1px, #dbe2ec 1px, transparent 0);
    background-size: 22px 22px;
  }
  #stage.drag { cursor: grabbing; }
  #canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  /* ---------- node ---------- */
  .node {
    position: absolute; border-radius: 9px; cursor: pointer;
    display: flex; align-items: flex-start; gap: 8px;
    transition: box-shadow .15s, border-color .15s, background .15s;
    user-select: none;
  }
  .node .txt { white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
  .node .tag {
    display: inline-block; width: 14px; height: 14px; line-height: 14px; text-align: center;
    font-style: normal; font-size: 9.5px; font-weight: 800; border-radius: 4px;
    margin-right: 5px; vertical-align: 1px; letter-spacing: 0;
  }
  .node .knob {
    flex: 0 0 auto; width: 12px; min-height: 12px; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: #94A3B8; font-weight: 700;
  }
  .node .knob.has {
    width: 13px; height: 13px; border-radius: 4px; border: 1px solid #D5DEE9;
    background: #fff; color: #64748B; line-height: 1;
  }
  .node.has-kids:hover .knob.has { border-color: #94A3B8; color: var(--ink); }

  /* depth 0 */
  .d0 { background: #0F172A; color: #fff; padding: 12px 16px; box-shadow: 0 8px 22px rgba(15,23,42,.22); }
  .d0 .txt { font-size: 14px; font-weight: 800; letter-spacing: .2px; }
  .d0 .knob.has { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.3); color: #fff; }

  /* depth 1 */
  .d1 { background: #fff; padding: 10px 13px 10px 15px; box-shadow: 0 2px 10px rgba(15,23,42,.07); border: 1px solid var(--hair); }
  .d1::before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3.5px; border-radius: 0 3px 3px 0; background: var(--dc, #c8102e); }
  .d1 .txt { font-size: 13px; font-weight: 800; letter-spacing: .1px; }

  /* depth 2 */
  .d2 { background: #fff; padding: 8px 11px; border: 1px solid var(--hair); box-shadow: 0 1px 4px rgba(15,23,42,.04); }
  .d2 .txt { font-size: 12.5px; font-weight: 700; color: #1E293B; }

  /* depth 3+ */
  .d3 { background: #FFFFFF; padding: 6px 10px; border: 1px solid #E7EDF4; box-shadow: 0 1px 3px rgba(15,23,42,.03); }
  .d3 .txt { font-size: 12px; font-weight: 500; color: #334155; line-height: 1.45; }
  .d3 .knob { display: none; }
  .d3::before {
    content: ''; position: absolute; left: -7px; top: 13px;
    width: 3px; height: 3px; border-radius: 50%; background: #C3CEDC;
  }

  .node.sel { box-shadow: 0 0 0 2px rgba(200,16,46,.55), 0 4px 14px rgba(200,16,46,.14); border-color: #e8a3ae !important; z-index: 5; }
  .node.hit { background: #FFF7E6; border-color: #F5C26B; }
  .node.hit .txt { color: #92400E; }
  .node.dim { opacity: .34; }

  /* ---------- footer ---------- */
  .ft {
    position: fixed; left: 0; right: 0; bottom: 0; height: 26px; z-index: 30;
    display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: rgba(255,255,255,.94); border-top: 1px solid var(--hair);
    font-size: 11px; color: var(--mute);
  }
  .ft b { color: #475569; font-weight: 700; }
  .ft .dot { width: 3px; height: 3px; border-radius: 50%; background: #CBD5E1; }

  /* ---------- legend ---------- */
  .legend {
    position: fixed; right: 16px; bottom: 40px; z-index: 20;
    background: #fff; border: 1px solid var(--hair); border-radius: 10px;
    padding: 9px 11px; box-shadow: 0 6px 18px rgba(15,23,42,.07); font-size: 11px;
    display: none; grid-template-columns: auto auto; gap: 6px 12px; align-items: center;
  }
  .legend.on { display: grid; }
  .legend i { width: 9px; height: 9px; border-radius: 3px; display: block; }

  /* ---------- breadcrumb ---------- */
  .crumb {
    position: fixed; left: 16px; bottom: 40px; z-index: 20; max-width: 62vw;
    background: #fff; border: 1px solid var(--hair); border-radius: 10px;
    padding: 8px 12px; box-shadow: 0 6px 18px rgba(15,23,42,.07);
    font-size: 11.5px; color: var(--sub); display: none; align-items: center; gap: 8px;
  }
  .crumb.on { display: flex; }
  .crumb b { color: var(--ink); font-weight: 700; }
  .crumb em { font-style: normal; color: #94A3B8; }
</style>
</head>
<body>

/* ==================================================================
   渲染引擎
   ================================================================== */
const TAGS = {
  '校验': { sym:'✓', bg:'#FEE2E2', fg:'#B91C1C' },
  '公式': { sym:'ƒ', bg:'#DBEAFE', fg:'#1D4ED8' },
  '枚举': { sym:'≡', bg:'#DCFCE7', fg:'#15803D' },
  '坑':   { sym:'!', bg:'#FFEDD5', fg:'#C2410C' },
  '权限': { sym:'K', bg:'#F3E8FF', fg:'#7E22CE' },
  '接口': { sym:'↔', bg:'#CFFAFE', fg:'#0E7490' },
  '口径': { sym:'◐', bg:'#E2E8F0', fg:'#475569' },
  '规则': { sym:'§', bg:'#E8EDF4', fg:'#334155' },
};
const TAG_W = 19;
const DCOLORS = ['#c8102e','#2563EB','#0E9F6E','#D97706','#7C3AED','#0891B2','#DB2777','#475569','#65A30D','#EA580C'];

const PAD = 32, VGAP = 7, HGAP = 46;
const FONTS = { 0:'800 14px', 1:'800 13px', 2:'700 12.5px', 3:'500 12px' };
const WIDTHS = { 0:300, 1:240, 2:220, 3:268 };
const LINEH  = { 0:22, 1:20, 2:19, 3:18.5 };
const MCTX = document.createElement('canvas').getContext('2d');
const FF = '"PingFang SC","Microsoft YaHei",system-ui,sans-serif';

function wrapText(text, maxW, fontPx, firstW) {
  MCTX.font = fontPx + ' ' + FF;
  const lines = []; let cur = ''; let limit = firstW || maxW;
  for (const ch of text) {
    if (MCTX.measureText(cur + ch).width > limit && cur) {
      lines.push(cur); cur = ch; limit = maxW;
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [''];
}

let uid = 0;
const nodeMap = new Map();
let root = null;

function build(arr, parent, depth, path, domain) {
  const out = [];
  arr.forEach((item, i) => {
    let title, tag = '', kids = [];
    if (typeof item === 'string') title = item;
    else {
      title = item[0];
      if (Array.isArray(item[1])) kids = item[1];
      else { tag = item[1] || ''; kids = item[2] || []; }
    }
    const dom = depth === 1 ? DCOLORS[i % DCOLORS.length] : domain;
    const node = { id: 'n' + (++uid), t: title, tag, c: [], parent, depth, path, domain: dom };
    node.c = build(kids, node, depth + 1, path.concat(title), dom);
    nodeMap.set(node.id, node);
    out.push(node);
  });
  return out;
}

const collapsed = new Set();
let selected = null;
let searchQ = '';

let stage, canvas, edgesEl, nodesEl, crumbEl;
let tx = 0, ty = 0, scale = 1;
let bbox = { w: 0, h: 0 };

function isOpen(n, searchOpen) {
  if (searchOpen && searchOpen.has(n.id)) return true;
  return !collapsed.has(n.id);
}

function render() {
  const q = searchQ.trim().toLowerCase();
  const hits = new Set();
  const searchOpen = new Set();
  if (q) {
    nodeMap.forEach(n => {
      if (n.t.toLowerCase().includes(q)) {
        hits.add(n.id);
        let p = n.parent;
        while (p) { searchOpen.add(p.id); p = p.parent; }
      }
    });
  }

  // ---- measure ----
  const visible = [];
  const links = [];
  function walk(n) {
    const d = Math.min(n.depth, 3);
    const w = WIDTHS[d];
    const padX = d === 0 ? 32 : d === 1 ? 28 : d === 2 ? 22 : 20;
    const knobW = d >= 3 ? 0 : 21;
    const innerW = w - padX - knobW;
    const lines = wrapText(n.t, innerW, FONTS[d], n.tag ? innerW - TAG_W : innerW);
    const padY = d === 0 ? 24 : d === 1 ? 20 : d === 2 ? 16 : 12;
    const h = padY + lines.length * LINEH[d];
    n._w = w; n._h = h; n._lines = lines; n._d = d;
    visible.push(n);
    const kids = isOpen(n, searchOpen) ? n.c : [];
    n._kids = kids;
    if (!kids.length) { n._subH = h; return; }
    let sum = 0;
    kids.forEach((k, i) => {
      walk(k);
      sum += k._subH;
      const gap = k.depth === 1 ? 26 : VGAP;
      if (i < kids.length - 1) sum += gap;
      links.push([n, k]);
    });
    n._subH = Math.max(h, sum);
  }
  walk(root);

  function place(n, x, top) {
    n._x = x;
    n._top = top;
    n._bottom = top + n._subH;
    // 顶部对齐：内容很多时父节点不会被推到子树正中（否则展开后父节点自己跑到屏幕外）
    n._y = top;
    let cy = top;
    n._kids.forEach(k => {
      place(k, x + n._w + HGAP, cy);
      cy += k._subH + (k.depth === 1 ? 26 : VGAP);
    });
  }
  place(root, PAD, PAD);

  // ---- bbox ----
  let maxX = 0, maxY = 0;
  visible.forEach(n => {
    maxX = Math.max(maxX, n._x + n._w);
    maxY = Math.max(maxY, n._y + n._h);
  });
  bbox = { w: maxX + PAD, h: maxY + PAD };
  canvas.style.width = bbox.w + 'px';
  canvas.style.height = bbox.h + 'px';
  edgesEl.setAttribute('width', bbox.w);
  edgesEl.setAttribute('height', bbox.h);
  edgesEl.setAttribute('viewBox', '0 0 ' + bbox.w + ' ' + bbox.h);

  // ---- edges ----
  const groups = new Map();
  links.forEach(([a, b]) => {
    if (!groups.has(a)) groups.set(a, []);
    groups.get(a).push(b);
  });
  let ep = '';
  groups.forEach((kids, a) => {
    const x1 = a._x + a._w, y1 = a._y + a._h / 2;
    const col = a.depth === 0 ? '#c8102e' : (a.domain || '#94A3B8');
    const sw = a.depth === 0 ? 1.8 : a.depth === 1 ? 1.4 : 1.2;
    const op = a.depth === 0 ? .5 : a.depth === 1 ? .44 : .4;

    if (a.depth >= 2) {
      // 树干式：父→干线、一条竖干、干线→各子（避免多条重叠成色块）
      const tx0 = x1 + 14;
      const ys = kids.map(k => k._y + k._h / 2);
      let d = 'M' + x1 + ' ' + y1 + ' H' + tx0;
      d += ' M' + tx0 + ' ' + Math.min(...ys) + ' V' + Math.max(...ys);
      kids.forEach((k, i) => {
        d += ' M' + tx0 + ' ' + ys[i] + ' H' + k._x;
      });
      ep += '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + sw +
            '" stroke-opacity="' + op + '" stroke-linejoin="round"/>';
    } else if (a.depth === 1) {
      const dx = Math.max(16, (kids[0]._x - x1) * 0.48);
      kids.forEach(k => {
        const y2 = k._y + k._h / 2;
        ep += '<path d="M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ',' + (k._x - dx) + ' ' + y2 + ',' + k._x + ' ' + y2 +
              '" fill="none" stroke="' + col + '" stroke-width="' + sw +
              '" stroke-opacity="' + op + '" stroke-linecap="round"/>';
      });
    } else {
      // 根 → 业务域：肘形主干
      const mx = x1 + 26;
      kids.forEach(k => {
        const y2 = k._y + k._h / 2;
        ep += '<path d="M' + x1 + ' ' + y1 + ' H' + mx + ' V' + y2 + ' H' + k._x +
              '" fill="none" stroke="' + col + '" stroke-width="' + sw +
              '" stroke-opacity="' + op + '" stroke-linejoin="round"/>';
      });
    }
  });
  edgesEl.innerHTML = ep;

  // ---- nodes ----
  let html = '';
  visible.forEach(n => {
    const d = n._d;
    const cls = ['node', 'd' + d];
    if (n.c.length) cls.push('has-kids');
    if (selected === n.id) cls.push('sel');
    if (q) cls.push(hits.has(n.id) ? 'hit' : 'dim');
    let style = 'left:' + n._x + 'px;top:' + n._y + 'px;width:' + n._w + 'px;min-height:' + n._h + 'px;';
    if (d === 1) style += '--dc:' + n.domain + ';';
    const knob = n.c.length
      ? '<span class="knob has">' + (collapsed.has(n.id) && !(searchOpen.has(n.id)) ? '+' : '−') + '</span>'
      : '<span class="knob"></span>';
    const tg = n.tag && TAGS[n.tag] ? TAGS[n.tag] : null;
    const tag = tg
      ? '<em class="tag" style="background:' + tg.bg + ';color:' + tg.fg + '">' + tg.sym + '</em>'
      : '';
    const text = n._lines.map((l, i) => escapeHtml(l)).join('\n');
    html += '<div class="' + cls.join(' ') + '" style="' + style + '" data-id="' + n.id + '" title="' +
            escapeAttr(n.t) + (n.c.length ? '　（' + n.c.length + ' 个子项）' : '') + '">' +
            knob + '<div class="txt">' + tag + text + '</div></div>';
  });
  nodesEl.innerHTML = html;

  document.getElementById('stat').textContent = visible.length;
  document.getElementById('statDepth').textContent = (function () { let m = 0; visible.forEach(n => m = Math.max(m, n.depth)); return m + 1; })();
  document.getElementById('zoom').textContent = Math.round(scale * 100) + '%';
  document.getElementById('qcnt').textContent = q ? (hits.size || '0') : '';
  updateCrumb();
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function applyTransform() {
  canvas.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  document.getElementById('zoom').textContent = Math.round(scale * 100) + '%';
}

function fit() {
  const r = stage.getBoundingClientRect();
  if (!bbox.w || !bbox.h) return;
  const s = Math.min((r.width - 70) / bbox.w, (r.height - 54) / bbox.h, 1);
  scale = Math.max(0.42, s);
  if (bbox.h * scale > r.height - 40) {
    tx = Math.max(40, (r.width - bbox.w * scale) / 2);
    ty = 18;
  } else {
    tx = (r.width - bbox.w * scale) / 2;
    ty = (r.height - bbox.h * scale) / 2;
  }
  applyTransform();
}

function centerOn(id, animate) {
  const n = nodeMap.get(id);
  if (!n || n._x == null) return;
  const r = stage.getBoundingClientRect();
  const cx = (n._x + n._w / 2) * scale;
  const cy = (n._y + n._h / 2) * scale;
  tx = r.width / 2 - cx;
  ty = r.height / 2 - cy;
  applyTransform();
}

function screenOf(n) {
  return { x: n._x * scale + tx, y: n._y * scale + ty };
}

/* ---------- 交互 ---------- */
let drag = null, moved = false;

function initInteraction() {
  nodesEl.addEventListener('click', e => {
    const el = e.target.closest('.node');
    if (!el) return;
    const id = el.dataset.id;
    const n = nodeMap.get(id);
    if (!n) return;
    if (moved) { moved = false; return; }

    if (n.c.length) {
      const willOpen = collapsed.has(id);
      if (n.depth === 1 && willOpen) {
        // 手风琴：一次只看一个业务域的完整子树，避免纵向被推到几万像素
        root.c.forEach(sib => { if (sib.id !== id) collapsed.add(sib.id); });
      }
      if (willOpen) collapsed.delete(id); else collapsed.add(id);
      selected = id;
      render();
      focusBlock(n);
    } else {
      selected = id;
      render();
    }
  });

  nodesEl.addEventListener('dblclick', e => {
    const el = e.target.closest('.node');
    if (!el) return;
    e.stopPropagation();
    expandSubtree(el.dataset.id);
  });

  stage.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (e.target.closest('.node')) return;
    drag = { x: e.clientX, y: e.clientY, tx, ty };
    moved = false;
    stage.classList.add('drag');
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
    tx = drag.tx + dx; ty = drag.ty + dy;
    applyTransform();
  });
  window.addEventListener('mouseup', () => {
    drag = null;
    stage.classList.remove('drag');
    setTimeout(() => { moved = false; }, 30);
  });

  stage.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const r = stage.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const next = Math.min(2.2, Math.max(0.2, scale * (e.deltaY > 0 ? 0.92 : 1.08)));
      const k = next / scale;
      tx = mx - (mx - tx) * k;
      ty = my - (my - ty) * k;
      scale = next;
      applyTransform();
    } else {
      tx -= e.deltaX;
      ty -= e.deltaY;
      applyTransform();
      e.preventDefault();
    }
  }, { passive: false });

  stage.addEventListener('dblclick', e => {
    if (e.target.closest('.node')) return;
    fit();
  });

  window.addEventListener('resize', () => { render(); applyTransform(); });
}

function focusBlock(n) {
  // 横向：能放下就居中，放不下就左对齐；纵向：把该域子树顶到视口上沿（上留一点上下文）
  const r = stage.getBoundingClientRect();
  const w = bbox.w * scale;
  tx = w < r.width - 40 ? (r.width - w) / 2 : 22;
  ty = 26 - (n._top - 40) * scale;
  applyTransform();
}

function expandSubtree(id) {
  const n = nodeMap.get(id);
  if (!n) return;
  if (n.depth === 1) root.c.forEach(sib => { if (sib.id !== id) collapsed.add(sib.id); });
  const stack = [n];
  while (stack.length) {
    const cur = stack.pop();
    collapsed.delete(cur.id);
    cur.c.forEach(k => stack.push(k));
  }
  render();
  if (scale < 0.78) { scale = 1; }   // 双击 = 放大到可读比例再看细节
  focusBlock(n);
}

function updateCrumb() {
  if (!selected) { crumbEl.classList.remove('on'); return; }
  const n = nodeMap.get(selected);
  if (!n) { crumbEl.classList.remove('on'); return; }
  const chain = n.path.slice(-3).map(escapeHtml).join(' <em>›</em> ');
  const kids = n.c.length ? '<em>·</em> ' + n.c.length + ' 个子项' : '';
  crumbEl.innerHTML = chain + (chain ? ' <em>·</em> ' : '') + '<b>' + escapeHtml(n.t) + '</b> ' + kids;
  crumbEl.classList.add('on');
}

/* ---------- 工具栏 ---------- */
function initToolbar() {
  document.getElementById('btnExpand').onclick = () => {
    collapsed.clear();
    render();
    document.getElementById('btnFit').click();
  };
  document.getElementById('btnCollapse').onclick = () => {
    collapsed.clear();
    nodeMap.forEach(n => { if (n.depth >= 1) collapsed.add(n.id); });
    render(); fit();
  };
  document.getElementById('btnFit').onclick = () => { render(); fit(); };
  document.getElementById('btnLegend').onclick = () => {
    document.getElementById('legend').classList.toggle('on');
  };
  document.getElementById('btnMd').onclick = exportMarkdown;

  const qEl = document.getElementById('q');
  let timer = null;
  qEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      searchQ = qEl.value;
      const before = selected;
      render();
      const q = searchQ.trim().toLowerCase();
      if (q) {
        let first = null;
        nodeMap.forEach(n => { if (!first && n.t.toLowerCase().includes(q)) first = n.id; });
        if (first) { selected = first; render(); centerOn(first); }
      } else {
        applyTransform();
      }
    }, 160);
  });
  qEl.addEventListener('keydown', e => { if (e.key === 'Escape') { qEl.value = ''; searchQ = ''; render(); } });
}

function exportMarkdown() {
  let out = '# 东风车队管理系统 · 业务逻辑全景\n\n';
  out += '> 依据 src/ 全量 Web 源码、deploy/cloudfunctions-20261020 云函数、sql/ 迁移脚本整理。\n\n';
  function walk(n, lv) {
    out += '  '.repeat(lv) + '- ' + n.t + (n.tag ? '  `' + n.tag + '`' : '') + '\n';
    n.c.forEach(k => walk(k, lv + 1));
  }
  root.c.forEach(n => walk(n, 0));
  const blob = new Blob([out], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '业务逻辑全景.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ---------- 域导航 ---------- */
function initChips() {
  const box = document.getElementById('chips');
  box.innerHTML = root.c.map((n, i) => {
    const c = DCOLORS[i % DCOLORS.length];
    return '<button class="chip" data-id="' + n.id + '"><i style="background:' + c + '"></i>' +
           escapeHtml(n.t) + ' <b>' + countLeaves(n) + '</b></button>';
  }).join('');
  box.addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    box.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    const id = b.dataset.id;
    const n = nodeMap.get(id);
    collapsed.delete(id);
    root.c.forEach(sib => { if (sib.id !== id) collapsed.add(sib.id); });
    selected = id;
    render();
    focusBlock(n);
  });
}

function countLeaves(n) {
  if (!n.c.length) return 1;
  return n.c.reduce((s, k) => s + countLeaves(k), 0);
}

function applyHash() {
  const m = /[#?&]d=?(\d+)/.exec(location.href || '');
  if (!m) return;
  const idx = Math.min(root.c.length - 1, Math.max(0, parseInt(m[1], 10) - 1));
  const n = root.c[idx];
  if (!n) return;
  expandSubtree(n.id);
  const chips = document.querySelectorAll('#chips .chip');
  chips.forEach(x => x.classList.remove('on'));
  if (chips[idx]) chips[idx].classList.add('on');
}

/* ---------- boot ---------- */
function boot() {
  stage = document.getElementById('stage');
  canvas = document.getElementById('canvas');
  edgesEl = document.getElementById('edges');
  nodesEl = document.getElementById('nodes');
  crumbEl = document.getElementById('crumb');

  root = {
    id: 'root', t: '东风车队管理系统 · 业务逻辑全景', tag: '', c: [], parent: null,
    depth: 0, path: [], domain: '#c8102e'
  };
  root.c = build(DATA, root, 1, [], '#c8102e');
  nodeMap.set('root', root);

  // 默认只展开一级业务域，点开即看子模块
  collapsed.clear();
  if (!/expand=all/.test(location.href)) {
    nodeMap.forEach(n => { if (n.depth >= 1) collapsed.add(n.id); });
  }

  const total = countLeaves(root);
  document.getElementById('statAll').textContent = total;
  document.getElementById('subtitle').textContent = 'Web 36 页 · 18 组件 · 云函数 7 个 · 20+ 表 · ' + total + ' 个逻辑点';

  initChips();
  initInteraction();
  initToolbar();
  render();
  fit();
  applyHash();
}

boot();
</script>
</body>
