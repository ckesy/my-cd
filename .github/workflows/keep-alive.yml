name: Keep Supabase Alive

on:
  schedule:
    # 每 3 天执行一次（UTC 时间 00:00，即北京时间 08:00）
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 允许在 GitHub Actions 页面手动触发测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Health Endpoint
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"