<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <!-- ============================================================
       ⭐⭐ 首屏防闪：必须在任何 CSS / JS bundle 之前执行
       ------------------------------------------------------------
       深色主题下，浏览器会先用 :root 的默认值（浅色）渲染一帧，
       等 main.js 跑完才 setAttribute('data-scheme')，于是"加载闪白"。
       这里把版式与底色提前定死，等于抢在第一次绘制之前。
       ⚠️ 这里的色值必须和 style.css 里六套 [data-scheme] 的
          --surface-page 保持一致，改那边记得同步这一行。
       ============================================================ -->
  <script>
    (function () {
      try {
        var saved = ''
        var u = null
        var orig = null
        try { u = JSON.parse(localStorage.getItem('currentUser') || 'null') } catch (e) { u = null }
        try { orig = JSON.parse(localStorage.getItem('originalUser') || 'null') } catch (e) { orig = null }
        /* ⭐ 管理员代看客户时，皮肤跟管理员（和 utils/theme.js 的 themeUserOf 同口径），
           否则这里会先按客户账号读、读不到再用默认，首屏闪一下才被 JS 纠正。 */
        var who = (orig && orig.role === 'admin' && u && u.role === 'customer') ? orig : u
        var acc = who ? String(who.account || who.phone || '').trim() : ''
        if (acc) saved = localStorage.getItem('app_theme:' + acc) || ''
        var scheme = saved.indexOf(':') > -1 ? saved.split(':')[0] : 'f'
        if ('abdef'.indexOf(scheme) < 0) scheme = 'f'
        var bg = {
          a: '#E9E3D6', b: '#E9EEF5',
          d: '#E9EDE0', e: '#DFE8D8', f: '#F8FAFC'
        }[scheme]
        var el = document.documentElement
        el.setAttribute('data-scheme', scheme)
        el.style.backgroundColor = bg
        /* 让浏览器原生控件（滚动条、input）也跟着变暗 */
        el.style.colorScheme = 'light'
      } catch (e) { /* 隐私模式读不到 localStorage，用默认浅色 */ }
    })()
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 站点图标：东风圆环（源图 public/DFLOGO1.png，重新生成用 scripts/make_favicon.py） -->
  <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
  <title>东风车队管理平台</title>
  
  <!-- 高德地图安全密钥配置（必须在任何 JS 代码之前）
       值由 Vite 在构建时从 .env 的 VITE_AMAP_SECURITY_CODE 注入，
       源码与仓库中不再出现明文。 -->
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: '%VITE_AMAP_SECURITY_CODE%'
    }
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

</body>

</html>
